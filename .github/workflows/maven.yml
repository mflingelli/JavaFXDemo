name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build Application and Installer with Maven
        run: mvn -B package --file pom.xml

      - name: Verify Installer File Existence
        run: |
          if (Test-Path "target\JavaFXDemo-Setup.exe") {
            Write-Output "Installer erfolgreich gefunden!"
          } else {
            Write-Error "Installer-Datei existiert nicht in target!"
            exit 1
          }
      
      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JavaFXDemo-Windows-Installer
          path: target\JavaFXDemo-Setup.exe
          if-no-files-found: error
