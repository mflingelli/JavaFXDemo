name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install NSIS via Chocolatey and update PATH
        shell: powershell
        run: |
          choco install nsis -y
          $nsisExe = Get-Command makensis.exe -ErrorAction SilentlyContinue
          if ($nsisExe) {
           $nsisPath = Split-Path $nsisExe.Path
          } else {
           if (Test-Path "C:\Program Files (x86)\NSIS") { $nsisPath = "C:\Program Files (x86)\NSIS" }
           elseif (Test-Path "C:\Program Files\NSIS") { $nsisPath = "C:\Program Files\NSIS" }
           else { $nsisPath = "C:\ProgramData\chocolatey\bin" }
          }
          Write-Output "Füge NSIS-Pfad zu GITHUB_PATH hinzu: $nsisPath"
          echo "$nsisPath" >> $env:GITHUB_PATH

      - name: Build Application and Installer with Maven
        run: mvn -B package -PInstaller --file pom.xml

      - name: Check if Installer exists
        id: check_file
        shell: powershell
        run: |
          $exists = Test-Path "target\JavaFXDemo-Setup.exe"
          echo "installer_exists=$exists" >> $env:GITHUB_OUTPUT

      - name: Upload Windows Installer Artifact
        if: steps.check_file.outputs.installer_exists == 'True'
        uses: actions/upload-artifact@v5
        with:
          name: JavaFXDemo-Windows-Installer
          path: target\JavaFXDemo-Setup.exe
          if-no-files-found: warn
