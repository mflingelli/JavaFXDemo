name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Setup NSIS Compiler
        uses: nsis-dev/setup-nsis@v3

      - name: Build Application and Installer with Maven
        run: mvn -B package -PInstaller --file pom.xml

      - name: Check if Installer exists
        id: check_file
        shell: powershell
        run: |
          $exists = Test-Path "target\JavaFXDemo-Setup.exe"
          echo "installer_exists=$exists" >> $env:GITHUB_OUTPUT

      - name: Upload Windows Installer Artifact
        if: steps.check_file.outputs.installer_exists == 'True'
        uses: actions/upload-artifact@v4
        with:
          name: JavaFXDemo-Windows-Installer
          path: target\JavaFXDemo-Setup.exe
          if-no-files-found: warn
